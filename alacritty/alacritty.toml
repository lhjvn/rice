[colors.primary]
background = "0x000000"
foreground = "0xbcbcbc"

[colors.cursor]
text = "0x000000"
cursor = "0xbcbcbc"

[colors.vi_mode_cursor]
text = "0x000000"
cursor = "0xbcbcbc"

[colors.search.matches]
foreground = "0xeeeeee"
background = "0x303030"

[colors.search.focused_match]
foreground = "0xeeeeee"
background = "0x303030"

[colors.hints.start]
foreground = "0xeeeeee"
background = "0x303030"

[colors.hints.end]
foreground = "0xeeeeee"
background = "0x303030"

[colors.line_indicator]
foreground = "0x00ff00"

[colors.footer_bar]
background = "0x000000"
foreground = "0x585858"

[colors.selection]
text = "0xeeeeee"
background = "0x303030"

# ANSI colors (apps use these). Give "black" a dark-gray instead of true black
# so text never becomes black on a black-ish background.
[colors.normal]
black   = "0x585858"
red     = "0x870000"
green   = "0x585858"
yellow  = "0x585858"
blue    = "0x585858"
magenta = "0x585858"
cyan    = "0x585858"
white   = "0xeeeeee"

[colors.bright]
black   = "0x585858"
red     = "0xff0000"
green   = "0x585858"
yellow  = "0x585858"
blue    = "0x585858"
magenta = "0x585858"
cyan    = "0x585858"
white   = "0xffffff"



[font]
normal.family = "CommitMono Nerd Font"

size = 7

[window]
opacity = 0.75
